name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Optional extras are part of the checked surface (e.g. the PostgreSQL
      # memory provider imports sqlalchemy).
      - run: uv sync --all-packages --extra postgres --extra a2a
      - run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: osa
          POSTGRES_PASSWORD: osa
          POSTGRES_DB: osa_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U osa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --extra postgres --extra a2a
      # Coverage gate: 84% justified — protocol/DB integration suites run in
      # this job (with extras + services); local runs skip them and sit ~86%.
      - run: uv run pytest --tb=short -q --cov=osa --cov-report=term --cov-fail-under=84
        env:
          OSA_TEST_DATABASE_URL: postgresql+asyncpg://osa:osa@localhost:54329/osa_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install pinned frontend dependencies
        run: npm ci --ignore-scripts
      - name: Type-check Control Panel
        run: npm run typecheck
      - name: Test Control Panel
        run: npm run test
      - name: Build Control Panel
        run: npm run build
      - name: Build Control Panel image
        run: docker build -t osa-control-panel:ci .
      - name: Control Panel image smoke test (health and SPA fallback)
        run: |
          cleanup() { docker rm -f osa-panel-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name osa-panel-smoke -p 8081:8080 osa-control-panel:ci
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/health/live >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::control panel never became healthy"; docker logs osa-panel-smoke; exit 1
          fi
          curl -fsS http://localhost:8081/agents/smoke | grep -q 'id="root"'
          docker stop --timeout 10 osa-panel-smoke >/dev/null
          exit_code=$(docker inspect osa-panel-smoke --format '{{.State.ExitCode}}')
          if [ "$exit_code" != "0" ]; then
            echo "::error::control panel exited with $exit_code on SIGTERM"; docker logs osa-panel-smoke; exit 1
          fi
          echo "Control Panel image smoke test passed."

  live-provider:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Detect live-provider opt-in
        id: opt_in
        shell: bash
        env:
          OSA_LIVE_PROVIDER_API_KEY: ${{ secrets.OSA_LIVE_PROVIDER_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -n "$OSA_LIVE_PROVIDER_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live-provider acceptance is disabled; set the OSA_LIVE_PROVIDER_API_KEY repository secret to opt in."
          fi
      - uses: astral-sh/setup-uv@v10.0.1
        if: steps.opt_in.outputs.enabled == 'true'
      - uses: actions/setup-python@v7
        if: steps.opt_in.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - name: Install live-provider dependencies
        if: steps.opt_in.outputs.enabled == 'true'
        run: uv sync --all-packages --extra litellm
      - name: Run live-provider acceptance
        if: steps.opt_in.outputs.enabled == 'true'
        env:
          OSA_LIVE_PROVIDER_API_KEY: ${{ secrets.OSA_LIVE_PROVIDER_API_KEY }}
          OSA_LIVE_PROVIDER_MODEL: ${{ vars.OSA_LIVE_PROVIDER_MODEL || 'openai/gpt-4o-mini' }}
        run: uv run pytest -q tests/acceptance/test_live_provider.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --extra postgres --extra a2a
      - name: Audit locked dependencies for known vulnerabilities (pip-audit)
        run: |
          uv export --format requirements-txt --no-hashes --no-dev --all-packages \
            --no-emit-package osa-generic-agent \
            --no-emit-package osa-adk-runtime \
            --no-emit-package osa-control-plane > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --progress-spinner off
      - name: Enforce permissive license allow-list (pip-licenses)
        # Exact-string allow-list: a new dependency (or a license-string
        # change on an upgrade) fails this step until a maintainer reviews
        # and adds the license here.
        run: |
          uv venv /tmp/lic-venv
          VIRTUAL_ENV=/tmp/lic-venv uv pip install -r requirements-audit.txt
          uvx --from pip-licenses pip-licenses --python /tmp/lic-venv/bin/python \
            --from mixed --order=license \
            --allow-only "MIT;MIT License;MIT-0;Apache Software License;Apache-2.0;Apache License 2.0;BSD License;BSD-3-Clause;BSD-2-Clause;Python Software Foundation License;PSF-2.0;Mozilla Public License 2.0 (MPL 2.0);Apache-2.0 AND MIT;Apache-2.0 OR BSD-3-Clause;Apache-2.0 OR BSD-2-Clause;Apache Software License; MIT License;MPL-2.0 AND MIT;Apache-2.0 AND CNRI-Python"
      - name: Generate CycloneDX SBOM for Python dependencies
        run: |
          uvx --from cyclonedx-bom cyclonedx-py requirements requirements-audit.txt \
            --of JSON -o osa-sbom-python.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-python-cyclonedx
          path: osa-sbom-python.cdx.json
          if-no-files-found: error

  container:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv lock --check
      - name: Build runtime image
        run: docker build -t osa-runtime:ci .
      - name: Generate runtime image SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: osa-runtime:ci
          format: cyclonedx-json
          output-file: sbom-osa-runtime.cdx.json
          upload-artifact: false
      - name: Container smoke test (ready, invoke, SIGTERM)
        run: |
          docker run -d --name osa-smoke -p 8080:8080 \
            -e OSA_ALLOW_FAKE_PROVIDER=1 \
            -v "$PWD/examples/smoke-bundle:/app/config:ro" \
            osa-runtime:ci
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::container never became ready"; docker logs osa-smoke; exit 1
          fi
          curl -fsS -X POST http://localhost:8080/v1/invoke \
            -H 'Content-Type: application/json' \
            -d '{"input":"hello","user_id":"smoke"}' | grep -q '"output"'
          # Graceful shutdown: SIGTERM must stop the service cleanly.
          docker stop --time 10 osa-smoke >/dev/null
          exit_code=$(docker inspect osa-smoke --format '{{.State.ExitCode}}')
          if [ "$exit_code" != "0" ]; then
            echo "::error::container exited with $exit_code on SIGTERM"; docker logs osa-smoke; exit 1
          fi
          echo "Container smoke test passed."
      - name: Build Control Plane image
        run: docker build -f Dockerfile.control-plane -t osa-control-plane:ci .
      - name: Generate Control Plane image SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: osa-control-plane:ci
          format: cyclonedx-json
          output-file: sbom-osa-control-plane.cdx.json
          upload-artifact: false
      - name: Control Plane smoke test (health)
        run: |
          docker run -d --name osa-cp-smoke -p 8000:8000 osa-control-plane:ci
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::control plane never became healthy"; docker logs osa-cp-smoke; exit 1
          fi
          docker stop --time 10 osa-cp-smoke >/dev/null
          exit_code=$(docker inspect osa-cp-smoke --format '{{.State.ExitCode}}')
          if [ "$exit_code" != "0" ]; then
            echo "::error::control plane exited with $exit_code on SIGTERM"; docker logs osa-cp-smoke; exit 1
          fi
          echo "Control Plane image smoke test passed."
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-images-cyclonedx
          path: |
            sbom-osa-runtime.cdx.json
            sbom-osa-control-plane.cdx.json
          if-no-files-found: error
