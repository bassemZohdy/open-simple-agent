name: Rollback image channel

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Which release component to roll back"
        required: true
        type: choice
        options:
          - runtime
          - control-plane
      digest:
        description: "Previously published digest to roll back to (sha256:<hex>)"
        required: true
        type: string
      channel:
        description: "Mutable channel to move (immutable version tags are never touched)"
        required: false
        type: string
        default: latest

permissions: {}

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate policy and roll back the channel
        env:
          COMPONENT: ${{ inputs.component }}
          CHANNEL: ${{ inputs.channel }}
          DIGEST: ${{ inputs.digest }}
          GITHUB_ACTIONS: "true"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::rollback must be dispatched from main"
            exit 1
          fi
          # Digest existence is validated by the inspect command before the
          # re-tag; signatures and attestations are digest-bound and survive.
          python scripts/rollback_release.py \
            --component "$COMPONENT" \
            --channel "$CHANNEL" \
            --digest "$DIGEST" \
            --execute
