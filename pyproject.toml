[project]
name = "open-simple-agent"
version = "0.1.0"
description = "A lightweight, configuration-driven platform for creating, running, managing, and discovering AI agents."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"

[tool.uv.workspace]
members = [
    "generic-agent",
    "runtimes/adk",
    "control-plane/backend",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = [
    "generic-agent/src",
    "runtimes/adk/src",
    "control-plane/backend/src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = [
    "osa.generic_agent",
    "osa.runtimes.adk",
    "osa.control_plane.backend",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*", "osa.*"]
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
