[project]
name = "open-simple-agent"
version = "0.1.0"
description = "A lightweight, configuration-driven platform for creating, running, managing, and discovering AI agents."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"

[tool.uv.workspace]
members = [
    "generic-agent",
    "runtimes/adk",
    "control-plane/backend",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = [
    "generic-agent/src",
    "runtimes/adk/src",
    "control-plane/backend/src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = [
    "osa.generic_agent",
    "osa.runtimes.adk",
    "osa.control_plane.backend",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# PEP 420 namespace layout: `osa` spans all three workspace src roots and has
# no top-level __init__.py, so tell mypy where the package bases are.
mypy_path = ["generic-agent/src", "runtimes/adk/src", "control-plane/backend/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # google-adk emits this from its own import machinery (LlmAgentConfig
    # subclasses the deprecated BaseAgentConfig upstream); nothing in this
    # project can avoid triggering it. Revisit when google-adk drops the
    # deprecated config classes.
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
    # google-adk flags its own JSON-schema declaration feature as
    # experimental; OSA only reaches that path for tools without a declared
    # parameters_schema (signature-derived declarations are the fallback).
    "ignore:\\[EXPERIMENTAL\\] feature FeatureName.JSON_SCHEMA_FOR_FUNC_DECL:UserWarning",
]
