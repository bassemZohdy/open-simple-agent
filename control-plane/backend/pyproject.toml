[project]
name = "osa-control-plane"
version = "0.1.0"
description = "Open Simple Agent Control Plane backend."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "osa-generic-agent",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# PostgreSQL persistence (ADR-004). Selected via
# OSA_CONTROL_PLANE_DATABASE_URL; schema managed by Alembic (osa-cp-migrate).
postgres = ["sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29", "alembic>=1.13"]

[project.scripts]
osa-cp-migrate = "osa.control_plane.backend.db:migrate_cli"

[tool.uv.sources]
osa-generic-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osa"]
