services:
  control-plane:
    image: ${OSA_CONTROL_PLANE_IMAGE:-ghcr.io/bassemzohdy/open-simple-agent-control-plane:latest}
    ports:
      - "127.0.0.1:${OSA_CONTROL_PLANE_PORT:-8000}:8000"
      - "127.0.0.1:${OSA_RUNTIME_PORT:-8081}:${OSA_RUNTIME_PORT:-8081}"
    environment:
      OSA_ALLOW_FAKE_PROVIDER: "1"
      OSA_CONTROL_PLANE_ALLOWED_ORIGINS: "http://localhost:${OSA_CONTROL_PANEL_PORT:-8080}"
      OSA_FAKE_PROVIDER_RESPONSE: "DEMO RESPONSE: deterministic fake response"
      OSA_DEPLOY_PROVIDER: local
      OSA_DEPLOY_PORT: "${OSA_RUNTIME_PORT:-8081}"
      OSA_DEPLOY_INVOKE_URL_TEMPLATE: "http://localhost:${OSA_RUNTIME_PORT:-8081}"
      OSA_DEPLOY_RUNTIME_ALLOWED_ORIGINS: "http://localhost:${OSA_CONTROL_PANEL_PORT:-8080}"
      OSA_LOG_FORMAT: json
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  control-panel:
    image: ${OSA_CONTROL_PANEL_IMAGE:-ghcr.io/bassemzohdy/open-simple-agent-control-panel:latest}
    ports:
      - "127.0.0.1:${OSA_CONTROL_PANEL_PORT:-8080}:8080"
    environment:
      OSA_API_BASE_URL: "http://localhost:${OSA_CONTROL_PLANE_PORT:-8000}"
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/health/live
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  seed:
    image: curlimages/curl:8.11.1
    profiles: ["seed"]
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      OSA_CONTROL_PLANE_URL: http://control-plane:8000
    volumes:
      - ./seed.sh:/seed.sh:ro
    entrypoint: ["/bin/sh", "/seed.sh"]
