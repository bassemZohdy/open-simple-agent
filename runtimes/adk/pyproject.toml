[project]
name = "osa-adk-runtime"
version = "0.1.5"
description = "Open Simple Agent ADK runtime implementation."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "osa-generic-agent",
    # Tested against the ADK 2.x line; majors may change Runner/session APIs.
    "google-adk>=2.0,<3.0",
    # Official MCP Python SDK; OSA normalizes the supported 1.x/2.x API
    # differences. The compatibility workflow exercises both major lines.
    "mcp>=1.24,<3",
]

[project.optional-dependencies]
# Production LiteLLM model adapter. Kept optional so deterministic test
# environments stay offline; the runtime image installs this extra.
litellm = ["litellm>=1.84"]
# PostgreSQL-backed memory persistence (ADR-003). Externalized via
# OSA_MEMORY_DATABASE_URL; the runtime image installs this extra.
postgres = ["sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29", "pg8000>=1.31,<2"]
# File-backed local SQLite memory/session persistence; never use for shared replicas.
sqlite = ["sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.20"]
# A2A protocol support (ADR-005): Agent Cards, A2A server/client. Pinned to
# the 1.x line (protobuf-based types) — within google-adk's own a2a range.
a2a = ["a2a-sdk[http-server]>=1.0,<2"]

[project.scripts]
osa-runtime = "osa.runtimes.adk.service:main"
osa-session-migrate = "osa.runtimes.adk.postgres_session:migrate_cli"
osa-memory-migrate = "osa.runtimes.adk.memory_migrate_cli:main"
osa-a2a-migrate = "osa.runtimes.adk.a2a_migrate_cli:main"

[tool.uv.sources]
osa-generic-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osa"]
