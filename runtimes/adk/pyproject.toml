[project]
name = "osa-adk-runtime"
version = "0.1.0"
description = "Open Simple Agent ADK runtime implementation."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "osa-generic-agent",
    "google-adk>=0.1.0",
]

[tool.uv.sources]
osa-generic-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osa"]
