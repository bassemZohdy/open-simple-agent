[project]
name = "osa-generic-agent"
version = "0.1.0"
description = "Open Simple Agent domain model and runtime contracts."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.9,<3",
    "opentelemetry-api>=1.25,<2",
]

[project.optional-dependencies]
# A2A client utilities (ADR-005). Server-side support lives in the ADK
# runtime, which pins the same line with the http-server subextra.
a2a = ["a2a-sdk>=1.0,<2"]
# Shared HTTP rate limiting (optional; selected with OSA_RATE_LIMIT_DATABASE_URL).
postgres = ["sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29", "pg8000>=1.31,<2"]

[project.scripts]
osa-rate-limit-migrate = "osa.generic_agent.rate_limit:migrate_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osa"]
