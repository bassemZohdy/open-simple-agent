[project]
name = "osa-generic-agent"
version = "0.1.0"
description = "Open Simple Agent domain model and runtime contracts."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osa"]
